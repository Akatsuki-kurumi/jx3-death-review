let replayController=null;

let step=0,path='',finished=false,recordRequest=0,battleRequest=0,activeBattle=null,battleController=null;const $=id=>document.getElementById(id);const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sword='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m5 19 4-4m-3-3 6 6M9 15 19 5l-1-2-3 1L6 13M3 21l3-3"/></svg>',shield='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM12 7v10M8 12h8"/></svg>';
const selected=text=>`<div class="menu-row selected"><span class="check">✓</span>${text}</div>`;
function guideOptions(){return `<div class="menu-scene"><div class="game-menu">${selected('在名剑大会中启用')}<div class="menu-divider"></div>${selected('保存所有角色记录')}${selected('启用角色对抗模式')}</div></div>`}
function guide(){return '<div class="guide"><div class="menu-scene"><div class="game-menu"><div class="menu-row">最大历史记录数量 <span style="margin-left:auto">›</span></div><div class="menu-row">最小战斗时间限制 <span style="margin-left:auto">›</span></div><div class="menu-divider"></div><div class="menu-row highlight-row"><span>▱ &nbsp; 打开数据所在目录</span><span>↗</span></div></div></div></div>'}
function render(){clearReplay();hideIconTooltip();recordRequest++;battleRequest++;if(battleController){battleController.abort();battleController=null}document.querySelector('.app').classList.toggle('library',finished);document.querySelector('.app').classList.toggle('battle-detail',finished&&!!activeBattle);$('library-actions').classList.toggle('hidden',!finished);document.querySelector('.app').classList.toggle('landing',step===0&&!finished);document.querySelector('main').classList.toggle('welcome',step===0&&!finished);document.querySelectorAll('.step').forEach((el,i)=>{el.classList.toggle('active',i===step);el.classList.toggle('done',i<step||finished);el.querySelector('.number').textContent=i<step||finished?'✓':`0${i+1}`});$('progress').textContent=finished?'配置演示完成':`步骤 ${step+1} / 4`;$('back').classList.toggle('hidden',step===0||finished);$('next').disabled=false;$('skip-llm').classList.toggle('hidden',step!==3||finished);$('next').type=step===3&&!finished?'submit':'button';if(step===3&&!finished)$('next').setAttribute('form','llm-form');else $('next').removeAttribute('form');$('open-path').classList.toggle('hidden',step!==2||finished||!isValidDirectory(path));
if(finished&&activeBattle){renderBattlePage(activeBattle);return}
if(finished){$('subtitle').textContent='';$('content').innerHTML='<div class="library-toolbar"><span id="record-count">正在读取战斗数据…</span><button class="secondary" id="refresh-records">刷新</button></div><div id="record-list" aria-live="polite"></div>';$('refresh-records').onclick=loadRecords;loadRecords();return}
if(step===0){$('subtitle').textContent='';$('content').innerHTML='<div class="impact-hero"><div class="impact-text">打完了<span>吗？</span></div></div>';$('hint').textContent='';$('next').textContent='开始复盘'}
if(step===1){$('subtitle').textContent='';$('content').innerHTML=`<div class="entry-path"><span>游戏右侧小扳手</span><i>→</i><span>茗伊插件集</span><i>→</i><span>战斗统计</span><i>→</i><span class="entry-current">战斗事件记录</span></div><div class="setup-panel"><div class="record-switch"><span class="check">✓</span>开启战斗事件记录</div><span class="flow-arrow">↓</span><div class="guide">${guideOptions()}</div><p class="compact-note">在游戏中勾选以上三项</p></div>`;$('hint').textContent='';$('next').innerHTML='我已开启记录并勾选以上三项 <span>→</span>'}
if(step===2){$('subtitle').textContent='';$('content').innerHTML=`<div class="entry-path"><span>战斗事件记录</span><i>→</i><span class="entry-current">打开数据所在目录</span></div><div class="instruction-grid">${guide(true)}<div class="explain"><p>复制文件夹地址栏中的完整路径。</p><div class="path-box"><label>数据目录</label><div class="path-value">${path?escapeHTML(path):'尚未填写'}</div></div></div></div>`;$('hint').textContent='';$('next').innerHTML=isValidDirectory(path)?'下一步 <span>→</span>':'粘贴目录地址 <span>↗</span>'}
if(step===3)renderLlmSetup();}
function renderLlmSetup(){
  $('subtitle').textContent='';$('hint').textContent='';$('next').innerHTML='完成配置 <span>✓</span>';
  $('content').innerHTML=`<form id="llm-form" class="llm-setup" autocomplete="off"><p class="llm-intro">填写模型服务商提供的连接信息，也可以跳过此步。</p><div class="llm-field"><label for="llm-base-url">Base URL</label><input id="llm-base-url" name="baseUrl" type="url" required placeholder="https://api.example.com/v1" autocomplete="off" spellcheck="false" aria-describedby="llm-url-hint"><small id="llm-url-hint">填写服务商的 API 基础地址，支持 HTTP / HTTPS。</small></div><div class="llm-field"><label for="llm-model">模型名</label><input id="llm-model" name="model" type="text" required placeholder="填写服务商提供的模型名称" autocomplete="off" spellcheck="false"></div><div class="llm-field"><label for="llm-api-key">API Key</label><input id="llm-api-key" name="apiKey" type="password" required placeholder="粘贴 API Key" autocomplete="new-password" spellcheck="false" autocapitalize="off"></div><p class="llm-session-note">配置仅在本次打开期间保留，刷新页面后需要重新填写。</p></form>`;
  $('llm-api-key').required=!llmConfig?.hasApiKey;
  $('llm-api-key').placeholder=llmConfig?.hasApiKey?'已安全保存，留空保持原密钥':'粘贴 API Key';
  document.querySelector('.llm-session-note').textContent='密钥由本机后端加密保存，页面不会读取已保存的密钥。';
  $('llm-form').insertAdjacentHTML('beforeend','<p class="error" id="llm-save-error" role="alert"></p>');
  for(const [key,id] of [['baseUrl','llm-base-url'],['model','llm-model']]){
    const input=$(id);input.value=llmDraft[key];input.oninput=()=>{llmDraft[key]=input.value;input.setCustomValidity('')};
  }
  $('llm-form').onsubmit=event=>{event.preventDefault();saveLlmAndFinish()};
}
function readLlmDraft(){
  if(!$('llm-form'))return;
  llmDraft={baseUrl:$('llm-base-url').value,model:$('llm-model').value};
}
async function saveLlmAndFinish(){
  if($('next').disabled)return;
  readLlmDraft();
  const baseUrl=llmDraft.baseUrl.trim(),model=llmDraft.model.trim(),apiKey=$('llm-api-key').value.trim();
  let validUrl=false;
  try{const url=new URL(baseUrl);validUrl=['http:','https:'].includes(url.protocol)&&!!url.hostname&&!url.username&&!url.password}catch{}
  $('llm-base-url').setCustomValidity(validUrl?'':'请输入完整的 HTTP 或 HTTPS 基础地址。');
  $('llm-model').setCustomValidity(model?'':'请填写模型名。');
  $('llm-api-key').setCustomValidity(apiKey||llmConfig?.hasApiKey?'':'请填写 API Key，或点击跳过。');
  if(!$('llm-form').reportValidity())return;
  $('next').disabled=true;
  try{llmConfig=await JclAI.api('/api/ai/config',{baseUrl,model,apiKey});$('llm-api-key').value='';llmDraft={baseUrl,model};finishSetup()}
  catch(error){$('llm-save-error').textContent=error.message;$('next').disabled=false}
}
function finishSetup(){finished=true;activeBattle=null;render();window.scrollTo(0,0)}
function openDialog(){$('directory').value=path;$('path-error').textContent='';$('directory').removeAttribute('aria-invalid');$('path-dialog').showModal();$('directory').focus()}
$('return-start').onclick=()=>{finished=false;activeBattle=null;step=0;render()};
$('open-path').onclick=openDialog;
$('change-folder').onclick=openDialog;
$('next').onclick=event=>{event.preventDefault();if(!finished&&step===3){saveLlmAndFinish();return}if(finished){step=0;finished=false}else if(step<2)step++;else if(isValidDirectory(path)){step=3}else{openDialog();return}render()};$('back').onclick=()=>{if(step===3)readLlmDraft();step=Math.max(0,step-1);render()};$('skip-llm').onclick=()=>{readLlmDraft();finishSetup()};$('close').onclick=$('cancel').onclick=()=>$('path-dialog').close();$('path-form').onsubmit=e=>{e.preventDefault();const value=$('directory').value.trim().replace(/^"(.*)"$/,'$1');if(!isValidDirectory(value)){$('path-error').textContent='请输入合法的完整目录路径，不可包含 < > : " | ? * 等非法字符。';$('directory').setAttribute('aria-invalid','true');return}path=value.replace(/\//g,'\\');$('path-dialog').close();activeBattle=null;render()};
function isValidDirectory(value){
  if(!value||/[\x00-\x1f<>"|?*]/.test(value))return false;
  const normalized=value.replace(/\//g,'\\');
  let parts;
  if(/^[a-zA-Z]:\\/.test(normalized)){parts=normalized.slice(3).split('\\')}
  else if(normalized.startsWith('\\\\')){parts=normalized.slice(2).split('\\');if(parts.length<2||!parts[0]||!parts[1])return false}
  else return false;
  if(parts.at(-1)==='')parts.pop();
  return parts.every(part=>part!==''&&!/[:\x00-\x1f<>"|?*]/.test(part)&&!/[. ]$/.test(part)&&!/^(con|prn|aux|nul|com[1-9¹²³]|lpt[1-9¹²³])(?:\.|$)/i.test(part));
}
async function loadRecords(){
  const request=++recordRequest;
  $('record-count').textContent='正在读取战斗数据…';
  $('record-list').innerHTML='';
  $('refresh-records').disabled=true;
  try{
    const response=await fetch('/api/records',{method:'POST',headers:{'Content-Type':'application/json','X-Preview-Client':'jx3'},body:JSON.stringify({directory:path})});
    const data=await response.json();
    if(request!==recordRequest||!finished)return;
    if(!response.ok)throw new Error(data.error||'读取目录失败，请重试。');
    $('record-count').textContent=data.records.length+' 场战斗';
    $('record-list').innerHTML=data.records.length?
      '<table class="records-table"><thead><tr><th scope="col">时间 <span>↓</span></th><th scope="col">地图</th><th scope="col"><span class="sr-only">操作</span></th></tr></thead><tbody>'+data.records.map(record=>'<tr><td>'+escapeHTML(record.time)+'</td><td>'+escapeHTML(record.map)+'</td><td class="record-action"><button class="review-button" data-filename="'+escapeHTML(record.filename)+'" aria-label="复盘 '+escapeHTML(record.time)+' '+escapeHTML(record.map)+'">复盘</button></td></tr>').join('')+'</tbody></table>':
      '<div class="empty-records"><span aria-hidden="true">▱</span><p>尚未发现该文件夹下的战斗数据</p></div>';
    const recordsByFilename=new Map(data.records.map(record=>[record.filename,record]));
    document.querySelectorAll('.review-button').forEach(button=>{button.onclick=()=>{const record=recordsByFilename.get(button.dataset.filename);if(record){activeBattle=record;render();window.scrollTo(0,0)}}});
  }catch(error){
    if(request!==recordRequest||!finished)return;
    $('record-count').textContent='读取失败';
    $('record-list').innerHTML='<div class="empty-records"><p>'+escapeHTML(error.message)+'</p><button class="secondary" id="fix-directory">修改目录</button></div>';
    $('fix-directory').onclick=()=>{finished=false;step=2;render();openDialog()};
  }finally{if(request===recordRequest&&finished)$('refresh-records').disabled=false}
}
function iconControl({url,label,description='',references=false,kind='talent'}){
  const local=typeof url==='string'&&/^\/api\/icons\/(std|origin)\/[1-9]\d*\.png(?:\?offline=1)?$/.test(url)?url:null;
  return `<button type="button" class="card-icon ${kind}-icon${local?'':' icon-fallback'}" aria-label="${escapeHTML(label)}" data-icon-label="${escapeHTML(label)}" data-icon-description="${escapeHTML(description|| (kind==='talent'?'暂无详细说明':''))}" data-icon-references="${references?'true':'false'}">${local?`<img src="${escapeHTML(local)}" alt="${escapeHTML(label)}" loading="lazy" decoding="async">`:''}<span class="icon-fallback-text"${local?' hidden':''}>${escapeHTML(label)}</span></button>`;
}
function playerCard(player){
  const unknown=player.maxHp==null;
  const scoreUnknown=player.equipScore==null;
  const backfilled=player.maxHpStatus==='prior_snapshot'||player.maxHpStatus==='later_snapshot';
  const note=unknown?'最大血量未知':(player.maxHpNote||'');
  const talents=player.talents||[];
  const kungfuName=player.kungfuName||'心法未知';
  return `<article class="player-card${unknown?' hp-unknown':''}${player.isFirstKillVictim?' is-killed':''}" data-player-id="${escapeHTML(player.id||'')}">
    <div class="player-top"><div class="player-identity">${iconControl({url:player.kungfuIconUrl,label:kungfuName,kind:'kungfu'})}<div class="player-name-block"><div class="player-name">${escapeHTML(player.name||'姓名未知')}</div>${player.isFirstKillVictim?'<span class="death-badge" title="本局首个被击杀的玩家">被击杀</span>':''}</div></div><div class="score-block"><span class="score-label">装分</span><strong class="score-value${scoreUnknown?' value-unknown':''}">${escapeHTML(player.equipScoreText??'未知')}</strong></div></div>
    <div class="health-line"><span>最大血量</span><span class="hp-value">${escapeHTML(player.maxHpText??'未知')}</span><span class="evidence-chip${backfilled?' backfilled':''}${unknown?' unresolved':''}">${escapeHTML(note)}</span>${player.hpSnapshotInconsistent?'<span class="evidence-chip discrepancy" title="该快照当前血量大于记录的最大血量；此处保留日志中的最大血量原值。">快照有差异</span>':''}</div>
    <div class="talent-section"><div class="talent-caption"><span>奇穴</span>${player.talentStatus==='partial'?'<span class="talent-status">奇穴记录不完整</span>':''}${player.talentSchemeChanged?'<span class="talent-status">日志中有方案变化</span>':''}${player.equipScoreChanged?'<span class="talent-status">日志中有装分变化</span>':''}</div><div class="talent-icons">${talents.length?talents.map(talent=>iconControl({url:talent.iconUrl,label:talent.label||'奇穴未知',description:talent.description,references:talent.descriptionHasReferences})).join(''):'<span class="talents-unknown">奇穴未知</span>'}</div></div>
  </article>`;
}
function firstKillBanner(firstKill){
  const recorded=firstKill?.status==='recorded';
  const text=firstKill?.text||'击杀信息暂不可用，接口可能尚未更新，请重启预览服务后重试。';
  const showAnalysis=recorded&&firstKill.canAnalyze===true;
  return `<section class="kill-overview${recorded?'':' no-kill'}" aria-label="首个击杀"><div class="kill-overview-copy"><h2>首个击杀</h2><p>${escapeHTML(text)}</p></div>${showAnalysis?'<div class="kill-analysis-action"><button type="button" class="secondary kill-analysis-button" disabled aria-label="击杀分析" aria-describedby="kill-analysis-note" title="正在准备分析数据">击杀分析</button><small id="kill-analysis-note">正在准备</small></div>':''}</section>`;
}
function battleTeams(view){
  const unknown=view.teamStatus==='unknown';
  const unassigned=view.unassignedPlayers||[];
  let html=firstKillBanner(view.firstKill)+(unknown?'<div class="team-notice">分队未知 · 暂无法可靠区分双方</div>':view.teamStatus==='inferred'?'<div class="team-notice">双方分队由战斗关系推断<span>我方为记录者所在队伍</span></div>':'');
  if(!unknown){html+='<div class="team-grid">'+(view.teams||[]).map((team,index)=>`<section class="team-column ${index===0?'team-friendly':'team-opponent'}"><div class="team-heading"><span>${escapeHTML(team.label)}</span><small>${team.players.length} 人</small></div><div class="team-players">${team.players.map(playerCard).join('')}</div></section>`).join('')+'</div>'}
  if(unassigned.length){html+=`<section class="unassigned-team"><div class="team-heading"><span>未分组玩家</span><small>${unassigned.length} 人</small></div><div class="unassigned-grid">${unassigned.map(playerCard).join('')}</div></section>`}
  if(!(view.teams||[]).some(team=>team.players.length)&&!unassigned.length){html+='<div class="empty-records"><p>尚未识别到玩家信息</p></div>'}
  const hasBackfill=[...(view.teams||[]).flatMap(team=>team.players),...unassigned].some(player=>['prior_snapshot','later_snapshot'].includes(player.maxHpStatus));
  if(hasBackfill)html+='<p class="battle-footnote">补齐血量来自入战附近的快照，并非入战时直接记录。</p>';
  if((view.warnings||[]).some(warning=>warning.code==='NO_END_MARKER'))html+='<p class="battle-footnote">日志未包含明确的结束标记，暂不判断胜负。</p>';
  return html;
}
function renderBattlePage(record,data=null,selectedTimeMs=0){
  $('subtitle').textContent='';
  $('content').innerHTML=`<div class="battle-toolbar"><button class="secondary" id="back-records">← 返回列表</button><div class="battle-meta"><strong>${escapeHTML(record.map)}</strong><time>${escapeHTML(record.time)}</time></div><button type="button" class="secondary global-review-button" id="global-review" disabled title="正在准备回顾数据">全局回顾</button></div><div id="battle-body" aria-live="polite" aria-busy="true"><div class="battle-loading"><span class="loading-ring" aria-hidden="true"></span>正在读取对局与回顾数据…</div></div>`;
  $('back-records').onclick=()=>{activeBattle=null;render();window.scrollTo(0,0)};
  if(data){
    $('battle-body').innerHTML=battleTeams(data.view);bindCardMedia($('battle-body'));
    $('battle-body').setAttribute('aria-busy','false');attachReplay(data.replay,data.view,selectedTimeMs,data.killAnalysis,data.battle);
  }else loadBattle(record);
}
function clearReplay(){
  aiController?.destroy();aiController=null;
  replayController?.destroy();replayController=null;
  document.querySelector('.app').classList.remove('replay-page');
  const returnButton=$('return-battle');if(returnButton)returnButton.onclick=null;
  $('library-actions').classList.toggle('hidden',!finished);
  const button=$('global-review');
  if(button){button.disabled=true;button.onclick=null}
}
function attachReplay(replay,view,selectedTimeMs=0,killAnalysis=null,battle=null){
  const killButton=document.querySelector('.kill-analysis-button');
  if(killButton){
    const available=Boolean(replay&&killAnalysis?.status==='ready');
    killButton.disabled=!available;killButton.title=available?'查看固定窗口内的击杀分析':'分析数据暂不可用，请重启预览服务后重试。';
    $('kill-analysis-note').textContent=available?'':'数据暂不可用';
    killButton.onclick=available?()=>renderKillPage(activeBattle,{view,replay,killAnalysis,battle},selectedTimeMs):null;
  }
  const button=$('global-review');
  if(!button)return;
  if(!replay){button.title='回顾数据暂不可用，请重启预览服务后重试。';return}
  button.disabled=false;button.title='位置、血量与战斗事件';
  button.onclick=()=>renderReplayPage(activeBattle,{view,replay,killAnalysis,battle},selectedTimeMs);
}
function renderKillPage(record,data,globalTime=0){
  clearReplay();hideIconTooltip();
  document.querySelector('.app').classList.add('replay-page');
  $('library-actions').classList.add('hidden');
  $('content').innerHTML=`<div class="battle-toolbar replay-page-toolbar"><div class="replay-page-heading"><button type="button" class="secondary" id="return-battle">返回复盘页面</button><h1>击杀分析</h1><time>${escapeHTML(record.map)} · ${escapeHTML(record.time)}</time></div><div id="ai-actions" class="ai-actions"></div></div><div id="ai-region"></div><div id="ai-jump-record"></div><div id="kill-region" aria-live="off"></div>`;
  replayController=JclKillUI.mount($('kill-region'),data);
  aiController=JclAI.mount($('ai-actions'),$('ai-region'),{record,data,directory:path,onSettings:async()=>{if(aiController&&!await aiController.confirmLeave())return;step=3;finished=false;activeBattle=null;render()},onSeek:async e=>{
    if(e.atMs<data.killAnalysis.window.startAtMs){if(aiController&&!await aiController.confirmLeave())return;renderReplayPage(record,data,e.atMs,e);return}
    replayController.setTime(e.atMs);showAiRecord(e);$('ai-jump-record').scrollIntoView({block:'start'});
  }});
  $('return-battle').onclick=async()=>{if(aiController&&!await aiController.confirmLeave())return;clearReplay();renderBattlePage(record,data,globalTime);window.scrollTo(0,0);document.querySelector('.kill-analysis-button')?.focus({preventScroll:true})};
  window.scrollTo(0,0);$('return-battle').focus({preventScroll:true});
}
function showAiRecord(e){$('ai-jump-record').innerHTML=`<div class="ai-claim"><strong>已定位 ${(e.atMs/1000).toFixed(3)} 秒 · 第 ${e.line} 行</strong><details><summary>查看原始记录</summary><pre class="ai-raw-record">${escapeHTML(e.raw||'请从报告证据展开原始记录。')}</pre></details></div>`}
function renderReplayPage(record,data,selectedTimeMs,evidence=null){
  clearReplay();hideIconTooltip();
  document.querySelector('.app').classList.add('replay-page');
  $('library-actions').classList.add('hidden');
  $('content').innerHTML=`<div class="battle-toolbar replay-page-toolbar"><div class="replay-page-heading"><button type="button" class="secondary" id="return-battle">返回复盘页面</button><h1>全局回顾</h1><time>${escapeHTML(record.map)} · ${escapeHTML(record.time)}</time></div>${evidence?'<button class="secondary global-review-button" id="return-ai-report">返回 AI 报告</button>':''}</div><div id="ai-jump-record"></div><div id="replay-region" class="replay-region" aria-live="off"></div>`;
  replayController=JclReplayUI.mount($('replay-region'),data.replay);replayController.setTime(selectedTimeMs);
  if(evidence){showAiRecord(evidence);$('return-ai-report').onclick=()=>renderKillPage(record,data,selectedTimeMs)}
  $('return-battle').onclick=()=>{
    const time=replayController.getTime();clearReplay();renderBattlePage(record,data,time);
    window.scrollTo(0,0);$('global-review').focus({preventScroll:true});
  };
  window.scrollTo(0,0);$('return-battle').focus({preventScroll:true});
}
async function loadBattle(record){
  clearReplay();
  const request=++battleRequest,directory=path,filename=record.filename;
  if(battleController)battleController.abort();
  const controller=new AbortController();battleController=controller;
  const current=()=>request===battleRequest&&finished&&activeBattle?.filename===filename&&path===directory;
  $('battle-body').setAttribute('aria-busy','true');
  $('battle-body').innerHTML='<div class="battle-loading"><span class="loading-ring" aria-hidden="true"></span>正在读取双方阵容与首个击杀…</div>';
  try{
    const response=await fetch('/api/battle',{method:'POST',headers:{'Content-Type':'application/json','X-Preview-Client':'jx3'},body:JSON.stringify({directory,filename}),signal:controller.signal});
    const data=await response.json();
    if(!current())return;
    if(!response.ok)throw new Error(data.error||'读取战斗失败，请重试。');
    if(!data.view)throw new Error('缺少阵容信息，请重试。');
    $('battle-body').innerHTML=battleTeams(data.view);bindCardMedia($('battle-body'));
    attachReplay(data.replay,data.view,0,data.killAnalysis,data.battle);
  }catch(error){
    if(!current()||error.name==='AbortError')return;
    $('battle-body').innerHTML=`<div class="empty-records"><p>${escapeHTML(error.message)}</p><button class="secondary" id="retry-battle">重新读取</button></div>`;
    $('retry-battle').onclick=()=>loadBattle(record);
  }finally{if(current())$('battle-body').setAttribute('aria-busy','false');if(battleController===controller)battleController=null}
}

// Image failures are terminal for this element; never substitute a remote URL or retry.
function imageFallback(image){
  const control=image.closest('.card-icon');
  image.onerror=null;image.onload=null;
  image.remove();
  if(control){control.classList.add('icon-fallback');control.querySelector('.icon-fallback-text').hidden=false}
}
let tooltipAnchor=null,tooltipTimer=null;
function hideIconTooltip(){
  clearTimeout(tooltipTimer);
  if(tooltipAnchor)tooltipAnchor.removeAttribute('aria-describedby');
  tooltipAnchor=null;
  $('icon-tooltip').hidden=true;
}
function positionIconTooltip(){
  if(!tooltipAnchor)return;
  const tooltip=$('icon-tooltip'),rect=tooltipAnchor.getBoundingClientRect();
  const width=tooltip.offsetWidth,height=tooltip.offsetHeight;
  const left=Math.max(12,Math.min(rect.left+rect.width/2-width/2,window.innerWidth-width-12));
  const below=rect.bottom+10;
  const top=below+height<=window.innerHeight-12?below:Math.max(12,rect.top-height-10);
  tooltip.style.left=left+'px';tooltip.style.top=top+'px';
}
function showIconTooltip(control){
  const changed=tooltipAnchor!==control;
  clearTimeout(tooltipTimer);
  if(tooltipAnchor&&tooltipAnchor!==control)tooltipAnchor.removeAttribute('aria-describedby');
  tooltipAnchor=control;
  $('tooltip-label').textContent=control.dataset.iconLabel;
  $('tooltip-description').textContent=control.dataset.iconDescription;
  $('tooltip-description').hidden=!control.dataset.iconDescription;
  $('tooltip-reference').hidden=control.dataset.iconReferences!=='true';
  $('icon-tooltip').hidden=false;
  if(changed)$('icon-tooltip').scrollTop=0;
  control.setAttribute('aria-describedby','icon-tooltip');
  positionIconTooltip();
}
function scheduleTooltipHide(){tooltipTimer=setTimeout(hideIconTooltip,180)}
function bindCardMedia(root){
  root.querySelectorAll('.card-icon img').forEach(image=>{
    image.onerror=()=>imageFallback(image);
    if(image.complete&&!image.naturalWidth)imageFallback(image);
  });
  root.querySelectorAll('.card-icon').forEach(control=>{
    control.onmouseenter=()=>showIconTooltip(control);
    control.onmouseleave=scheduleTooltipHide;
    control.onfocus=()=>showIconTooltip(control);
    control.onblur=scheduleTooltipHide;
    control.onclick=()=>showIconTooltip(control);
    control.onkeydown=event=>{
      if(event.key==='Escape')hideIconTooltip();
      if(event.key==='ArrowDown'){event.preventDefault();$('icon-tooltip').focus()}
    };
  });
}
function initIconTooltip(){
  const tooltip=$('icon-tooltip');
  tooltip.onmouseenter=()=>clearTimeout(tooltipTimer);
  tooltip.onmouseleave=scheduleTooltipHide;
  tooltip.onfocus=()=>clearTimeout(tooltipTimer);
  tooltip.onblur=scheduleTooltipHide;
  tooltip.onkeydown=event=>{if(event.key==='Escape'){const anchor=tooltipAnchor;anchor?.focus();hideIconTooltip()}};
  window.addEventListener('resize',positionIconTooltip);
  window.addEventListener('scroll',event=>{if(!tooltip.contains(event.target))hideIconTooltip()},true);
}

initIconTooltip();
render();
</script></body></html>
